name: Claude

# On-demand: mention @claude in a PR or issue comment (e.g. "@claude explain this
# again", "@claude fix the failing test"). Only the owner, members and
# collaborators trigger it, so a stranger's comment can't drive a write-access run.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    if: >-
      (contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (contains(github.event.review.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      ((contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       github.event_name == 'issues' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Never on a fork's PR: the action checks out the PR head, and a fork's
      # CLAUDE.md or .claude/ hooks would run with this job's write access.
      - name: Refuse fork PRs
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          head_repo=$(gh api "repos/$REPO/pulls/$PR" --jq .head.repo.full_name)
          if [ "$head_repo" != "$REPO" ]; then echo "::error::PR $PR is from a fork ($head_repo); @claude doesn't run on forks."; exit 1; fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/mtblck/claude-marketplace.git
          plugins: |
            pr-review@mtblck
            dependency-review@mtblck
            maintenance@mtblck
            repo-setup@mtblck
            superpowers@mtblck
