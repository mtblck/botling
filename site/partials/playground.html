<section class="play wrap" aria-label="Playground">
      <div class="preview">
        <div class="stage card">
          <form class="seed" id="seed-form">
            <label for="seed">Seed</label>
            <div class="seed-row">
              <input id="seed" name="seed" type="text" autocomplete="off" spellcheck="false" maxlength="200" placeholder="Try your name…" />
              <!-- Icon: Lucide (ISC licence), lucide.dev -->
              <button class="btn" type="button" id="random"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>Random</button>
            </div>
          </form>
          <div class="big" id="big" role="img" aria-label="Your {{label}}"></div>
          <ul class="sizes" id="sizes" aria-label="The same {{label}} at 96, 48, 32 and 24 pixels"></ul>
          <p class="note">{{small-note}}</p>
        </div>
        <div class="output card">
          <pre class="code" data-nocopy><code id="code"></code></pre>
          <div class="actions">
            <button class="btn" type="button" id="copy-code">Copy code</button>
            <button class="btn" type="button" id="copy-svg">Copy SVG</button>
            <fieldset class="downloads" id="downloads">
              <legend>Download</legend>
              <button class="btn" type="button" data-format="svg">SVG</button>
              <button class="btn" type="button" data-format="png">PNG</button>
              <button class="btn" type="button" data-format="jpeg">JPG</button>
              <button class="btn" type="button" data-format="gif">GIF</button>
            </fieldset>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
      </div>
      <section class="options card" id="options" aria-labelledby="options-h">
        <div class="options-head">
          <h2 id="options-h">Options</h2>
          <button class="btn" type="button" id="reset">Reset</button>
        </div>
      </section>
    </section>

    <section class="crowd wrap" aria-labelledby="crowd-h">
      <div class="head">
        <h2 id="crowd-h">Same options, more seeds</h2>
        <button class="btn" type="button" id="shuffle">Shuffle</button>
      </div>
      <ul class="gallery" id="gallery"></ul>
    </section>
